connection:
  endpoint: "openeo.dataspace.copernicus.eu"


sentinel2_l2a:
  collection: "SENTINEL2_L2A"
  scl_band: "SCL"
  cloud_values: [8,9,10]

sentinel2_l1c:
  collection: "SENTINEL2_L1C"
  bands: ["B02", "B03", "B04", "B05", "B06", "B07", "B8A", "B08", "B11", "B12", "sunZenithAngles", "sunAzimuthAngles"]

water_mask:
  collection: "ESA_WORLDCOVER_10M_2021_V2"
  band: "MAP"
  water_values: [80]

omnicloudmask:
  # Public URL of the MLM STAC item built by omnicloudmask/export_onnx.py; null -> L2A SCL cloud mask.
  model_url: "https://s3.waw3-1.cloudferro.com/project_dependencies/snowcop/omnicloudmask_v4.json"

glacier_mask:
  # Public URL of the STAC collection built by stac/glacier/build_collection.py; null -> no glacier mask.
  stac_url: null
  band: "glacier"


corsa_job: None