# @package experiment
# Historical SCA reconstruction + SWE estimation
# Run: python -m openeo_mountains_snow.main +experiment=reconstruction

pipeline: "reconstruction"

aoi:
  west: 631800.0
  south: 5170700.0
  east: 637800.0
  north: 5176200.0
  crs: "EPSG:32632"

# NOTE: MODIS STAC (Eurac) covers only up to 2023-02-01, so keep dates within that range.
temporal_extent: ['2022-09-10', '2023-01-15']
modis_temporal_extent: ['2023-01-10', '2023-01-15']
agera_temporal_extent: ['2023-01-10', '2023-01-15']

title_prefix: "swe_reconstruction"

job_options:
  executor-memory: "8G"
  executor-memoryOverhead: "500m"
  python-memory: "15G"
